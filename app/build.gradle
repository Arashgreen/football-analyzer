plugins {
    id 'com.android.application'
}

android {
    namespace 'com.hoosha.footballanalyzer'
    compileSdk 34

    defaultConfig {
        applicationId "com.hoosha.footballanalyzer"
        minSdk 24          // Android 7.0+
        targetSdk 34
        versionCode 1
        versionName "1.0.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            applicationIdSuffix ".debug"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// WebView app: no external dependencies beyond AndroidX appcompat
dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'

    // Fix: kotlin-stdlib-jdk7/jdk8 merged into kotlin-stdlib since 1.8
    constraints {
        implementation('org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22') {
            because 'aligns kotlin-stdlib-jdk8 with kotlin-stdlib'
        }
        implementation('org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.22') {
            because 'aligns kotlin-stdlib-jdk7 with kotlin-stdlib'
        }
    }
}
